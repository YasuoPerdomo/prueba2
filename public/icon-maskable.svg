<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2C59" />
      <stop offset="50%" stop-color="#163866" />
      <stop offset="100%" stop-color="#091B38" />
    </linearGradient>
    <linearGradient id="coralGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA84A" />
      <stop offset="100%" stop-color="#EFA351" />
    </linearGradient>
    <linearGradient id="tealGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ADB5" />
      <stop offset="100%" stop-color="#00838F" />
    </linearGradient>
  </defs>

  <!-- Full-bleed background covering 100% of canvas -->
  <rect width="512" height="512" fill="url(#bgGradMask)" />

  <!-- Safe Zone content container (scaled to 75% centered) -->
  <g transform="translate(64, 64) scale(0.75)">
    <!-- Outer Ring Accent -->
    <circle cx="256" cy="256" r="210" fill="none" stroke="#EFA351" stroke-width="8" stroke-opacity="0.3" stroke-dasharray="16 8" />

    <!-- Marine Wave Accents -->
    <path d="M 96 350 Q 176 310 256 350 T 416 350" fill="none" stroke="url(#tealGradMask)" stroke-width="14" stroke-linecap="round" opacity="0.6" />

    <!-- Fish Body -->
    <path d="M 370 230 C 330 160 210 140 130 200 C 100 222 80 250 80 256 C 80 262 100 290 130 312 C 210 372 330 352 370 282 L 436 330 L 416 256 L 436 182 Z" fill="url(#coralGradMask)" />
    
    <!-- Fish Inner Arch / Belly -->
    <path d="M 330 240 C 300 190 220 180 160 220 C 140 234 130 250 130 256 C 130 262 140 278 160 292 C 220 332 300 322 330 272 Z" fill="#0F2C59" />

    <!-- Eye of Fish -->
    <circle cx="170" cy="245" r="14" fill="#FFFFFF" />
    <circle cx="168" cy="245" r="7" fill="#0F2C59" />

    <!-- Marine Gill & Fin -->
    <path d="M 230 220 Q 250 256 230 292" fill="none" stroke="url(#tealGradMask)" stroke-width="12" stroke-linecap="round" />
    <path d="M 260 256 Q 300 250 310 270 Q 285 276 260 256 Z" fill="url(#coralGradMask)" />

    <!-- Typography TP -->
    <text x="256" y="445" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="6">
      TERMINAL
    </text>
    <text x="256" y="480" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#00ADB5" text-anchor="middle" letter-spacing="10">
      PESQUERO
    </text>
  </g>
</svg>
